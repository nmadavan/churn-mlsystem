<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#55606b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="990" height="470" fill="#ffffff"/>

  <!-- feedback loop (drawn first, behind boxes) -->
  <polyline points="105,380 105,26 690,26 690,80" fill="none" stroke="#b5462f" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="360" y="20" font-size="11" fill="#b5462f">retrain when triggered</text>

  <!-- main flow arrows -->
  <line x1="190" y1="113" x2="213" y2="113" stroke="#55606b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="385" y1="113" x2="408" y2="113" stroke="#55606b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="580" y1="113" x2="603" y2="113" stroke="#55606b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="775" y1="113" x2="798" y2="113" stroke="#55606b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- registry -> serving -->
  <line x1="820" y1="146" x2="705" y2="228" stroke="#55606b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="885" y1="146" x2="885" y2="228" stroke="#55606b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- serving -> monitoring -->
  <line x1="670" y1="296" x2="540" y2="378" stroke="#55606b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="860" y1="296" x2="560" y2="378" stroke="#55606b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- monitoring -> retraining trigger -->
  <line x1="408" y1="413" x2="192" y2="413" stroke="#55606b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- boxes -->
  <!-- A -->
  <rect x="20" y="80" width="170" height="66" rx="8" fill="#e3f0fb" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="105" y="109" font-size="13" font-weight="600" fill="#1f2a36" text-anchor="middle">Raw data /</text>
  <text x="105" y="127" font-size="13" font-weight="600" fill="#1f2a36" text-anchor="middle">daily CSVs</text>
  <!-- B -->
  <rect x="215" y="80" width="170" height="66" rx="8" fill="#e3f0fb" stroke="#2f6fa8" stroke-width="1.5"/>
  <text x="300" y="103" font-size="13" font-weight="600" fill="#1f2a36" text-anchor="middle">Ingestion</text>
  <text x="300" y="121" font-size="11" fill="#45525f" text-anchor="middle">schema + record</text>
  <text x="300" y="135" font-size="11" fill="#45525f" text-anchor="middle">validation</text>
  <!-- C -->
  <rect x="410" y="80" width="170" height="66" rx="8" fill="#eef2f4" stroke="#5a6b7b" stroke-width="1.5"/>
  <text x="495" y="117" font-size="13" font-weight="600" fill="#1f2a36" text-anchor="middle">Training table</text>
  <!-- D -->
  <rect x="605" y="80" width="170" height="66" rx="8" fill="#e5f5e9" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="690" y="103" font-size="13" font-weight="600" fill="#1f2a36" text-anchor="middle">Training pipeline</text>
  <text x="690" y="121" font-size="11" fill="#45525f" text-anchor="middle">baseline vs candidate</text>
  <text x="690" y="135" font-size="11" fill="#45525f" text-anchor="middle">+ promotion guardrail</text>
  <!-- E -->
  <rect x="800" y="80" width="170" height="66" rx="8" fill="#e5f5e9" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="885" y="109" font-size="13" font-weight="600" fill="#1f2a36" text-anchor="middle">Model registry</text>
  <text x="885" y="127" font-size="11" fill="#45525f" text-anchor="middle">current_best.json</text>
  <!-- F -->
  <rect x="605" y="230" width="170" height="66" rx="8" fill="#fdf0e3" stroke="#cc7a2b" stroke-width="1.5"/>
  <text x="690" y="259" font-size="13" font-weight="600" fill="#1f2a36" text-anchor="middle">Online API</text>
  <text x="690" y="277" font-size="11" fill="#45525f" text-anchor="middle">/predict, /health</text>
  <!-- G -->
  <rect x="800" y="230" width="170" height="66" rx="8" fill="#fdf0e3" stroke="#cc7a2b" stroke-width="1.5"/>
  <text x="885" y="263" font-size="13" font-weight="600" fill="#1f2a36" text-anchor="middle">Batch scoring</text>
  <!-- H -->
  <rect x="410" y="380" width="170" height="66" rx="8" fill="#fde7e7" stroke="#b5462f" stroke-width="1.5"/>
  <text x="495" y="409" font-size="13" font-weight="600" fill="#1f2a36" text-anchor="middle">Monitoring</text>
  <text x="495" y="427" font-size="11" fill="#45525f" text-anchor="middle">PSI drift · data quality</text>
  <!-- I -->
  <rect x="20" y="380" width="170" height="66" rx="8" fill="#fde7e7" stroke="#b5462f" stroke-width="1.5"/>
  <text x="105" y="417" font-size="13" font-weight="600" fill="#1f2a36" text-anchor="middle">Retraining trigger</text>
</svg>
